name = "chitalka"
main = "worker/worker.js"
compatibility_date = "2026-10-01"
account_id = "42e5b31979fe1cef44bc3b38aa131be4"
workers_dev = false
preview_urls = false
routes = [{ pattern = "chitalka.lezgi.com", custom_domain = true }]

[vars]
EMAIL_FROM = "noreply@chitalka.lezgi.com"

[assets]
directory = "./app"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "DATA"
bucket_name = "chitalka-data"
