<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Читалка</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Читалка">
<meta name="theme-color" content="#3D5FE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Nunito:wght@400;600;700;800;900&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one centred column (920px) for shelves and settings; a narrower 680px reading column; bottom sheets for details. */
:root{
  --font-display:'Unbounded','Nunito',system-ui,sans-serif;
  --font-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-read:'Literata',Georgia,'Times New Roman',serif;
  --bg:#EFF1F5; --surface:#FFFFFF; --surface-2:#E6E9F0; --ink:#1C2230; --muted:#5D6578; --line:#D7DCE5;
  --accent:#3653C4; --on-accent:#FFFFFF; --second:#14897F; --on-second:#FFFFFF; --gold:#B8871F; --epic:#7A45C8;
  --danger:#C2412D; --ok:#2E8B57; --paper:#FFFFFF; --grid:transparent; --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
  --radius:14px; --read-size:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141B; --surface:#1A1F29; --surface-2:#232A36; --ink:#E6E9F0; --muted:#9AA2B3; --line:#2D3442;
    --accent:#8AA2FF; --on-accent:#0E1430; --second:#3CC8BF; --on-second:#082422; --gold:#E2B850; --epic:#B48CFF;
    --danger:#F07A63; --ok:#59C08A; --paper:#1A1F29; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1F29; --surface-2:#232A36; --ink:#E6E9F0; --muted:#9AA2B3; --line:#2D3442;
  --accent:#8AA2FF; --on-accent:#0E1430; --second:#3CC8BF; --on-second:#082422; --gold:#E2B850; --epic:#B48CFF;
  --danger:#F07A63; --ok:#59C08A; --paper:#1A1F29; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
/* Kid themes: day and night share one flat look — cobalt for what you press and count, terracotta for clothes and rewards; the switch in the kid header flips them */
body[data-kt]{--font-display:'Onest',system-ui,sans-serif; --font-ui:'Onest',system-ui,sans-serif; --radius:16px; --shadow:none; --grid:transparent}
body[data-kt="day"]{
  --bg:#F7F3EE; --surface:#FFFFFF; --surface-2:#F1E9E2; --ink:#1A1A22; --muted:#6A6670; --line:#E9E2DA;
  --accent:#3D5FE0; --on-accent:#FFFFFF; --second:#3D5FE0; --on-second:#FFFFFF; --gold:#D2694F; --epic:#7A45C8;
  --danger:#C2412D; --ok:#2E8B57; --paper:#FFFFFF; --tint:#F1DCD3;
  --c1:#C26E48; --c2:#DE8C64; --c3:#EFA982; --wh:#FFF8F1; color-scheme:light;
}
body[data-kt="night"]{
  --bg:#14151D; --surface:#1E2029; --surface-2:#272A36; --ink:#EFEDEA; --muted:#A09CA6; --line:#2D2F3A;
  --accent:#7D96FF; --on-accent:#0D1030; --second:#7D96FF; --on-second:#0D1030; --gold:#EE8C72; --epic:#B48CFF;
  --danger:#F07A63; --ok:#59C08A; --paper:#1E2029; --tint:#232B48;
  --c1:#C8724C; --c2:#E6946B; --c3:#F5B28C; --wh:#F6EDE6; color-scheme:dark;
}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
#app{max-width:920px; margin:0 auto; padding-block:20px 56px}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.2}
p{margin:0}
a{color:var(--accent)}
.display{font-family:var(--font-display); font-weight:700; letter-spacing:-.01em}
.muted{color:var(--muted)}
.eyebrow{font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.grow{flex:1; min-width:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; -webkit-tap-highlight-color:transparent}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 20px; border-radius:var(--radius);
  background:var(--accent); color:var(--on-accent); font-weight:800; text-decoration:none; cursor:pointer; text-align:center; line-height:1.15}
.btn.alt{background:var(--surface-2); color:var(--ink)}
.btn.second{background:var(--second); color:var(--on-second)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.danger{background:var(--danger); color:#FFFFFF}
.btn.small{min-height:40px; padding:0 14px; font-size:14px}
.btn.big{min-height:60px; padding:0 28px; font-size:19px}
.btn[disabled]{opacity:.5; cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.acts{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
input,select,textarea{box-sizing:border-box; font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; min-height:46px; width:100%}
textarea{min-height:120px; resize:vertical}
label{display:grid; gap:6px; font-weight:700; font-size:14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:calc(var(--radius) + 4px); padding:20px; display:grid; gap:14px; box-shadow:var(--shadow)}
.status{min-height:1.4em; color:var(--muted); font-weight:600}
.okmsg{background:color-mix(in srgb, var(--ok) 14%, var(--surface)); color:var(--ink); border-radius:10px; padding:10px 14px; font-weight:700}
.err{color:var(--danger); font-weight:700}
.warn{background:color-mix(in srgb, var(--gold) 18%, var(--surface)); border-radius:10px; padding:10px 12px; font-size:14px}

/* avatars */
.ava{--c:#2F5DA8; width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--c); color:#FFFFFF; font-weight:800; font-size:20px; font-family:var(--font-ui)}
.ava.big{width:96px; height:96px; font-size:42px; font-family:var(--font-display)}

/* loading */
.loading{min-height:60vh; display:grid; place-items:center; text-align:center; gap:12px}
.logo{font-family:'Unbounded','Nunito',sans-serif; font-weight:700; font-size:clamp(34px, 6vw, 52px); letter-spacing:-.02em}
.logo i{font-style:normal; color:var(--accent)}

/* setup */
.setup{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:24px; align-items:start; padding-top:4vh}
.setup .brand{display:grid; gap:16px; padding-top:8px}
.setup .lead{font-size:19px; color:var(--muted); max-width:30ch}
.steps{margin:0; padding-left:22px; display:grid; gap:6px; color:var(--muted); font-weight:700}
.steps li.cur{color:var(--ink)}
.steps li.done{color:var(--ok)}
.kidlist{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:999px; padding:4px 6px 4px 4px; font-weight:700}
.chip .ava{width:32px; height:32px; font-size:15px}
.chip button{width:30px; height:30px; border-radius:50%; color:var(--muted); font-size:18px}
.kidform{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:12px}
.kidform .colors{grid-column:1/-1}
fieldset{border:0; padding:0; margin:0}
legend{font-weight:700; font-size:14px; margin-bottom:6px}
.colors{display:flex; flex-wrap:wrap; gap:10px}
.sw{position:relative; display:block}
.sw input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.sw span{display:block; width:40px; height:40px; border-radius:50%; background:var(--c); border:3px solid var(--surface); box-shadow:0 0 0 2px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible + span{outline:3px solid var(--accent); outline-offset:3px}

/* pin pad */
.pin{display:grid; justify-items:center; gap:12px; text-align:center; padding:8px 0}
.pin h2{font-family:var(--font-display); font-size:22px}
.dots{display:flex; gap:14px; margin-top:6px}
.dots span{width:16px; height:16px; border-radius:50%; border:2px solid var(--ink)}
.dots span.on{background:var(--ink)}
.pinerr{min-height:1.4em; color:var(--danger); font-weight:700}
.keys{display:grid; grid-template-columns:repeat(3, 72px); gap:12px}
.keys button{width:72px; height:72px; border-radius:50%; background:var(--surface-2); font-size:26px; font-weight:700}
.keys button:active{background:var(--line)}

/* profiles */
.profiles{display:grid; justify-items:center; gap:28px; padding-top:6vh; text-align:center}
.profiles h1{font-size:clamp(26px, 4.5vw, 40px)}
.ptiles{display:flex; flex-wrap:wrap; justify-content:center; gap:20px}
.ptile{display:grid; justify-items:center; gap:6px; padding:18px 14px; width:168px; border-radius:20px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow)}
.ptile b{font-size:20px}
.ptile:active{transform:scale(.98)}

/* parent */
.parent{display:grid; gap:18px}
.phead{display:flex; align-items:end; gap:12px; justify-content:space-between; flex-wrap:wrap}
.phead h1{font-size:28px}
.tabs{display:flex; gap:6px; flex-wrap:wrap; background:var(--surface-2); padding:5px; border-radius:calc(var(--radius) + 2px); width:fit-content; max-width:100%}
.tab{padding:10px 16px; border-radius:var(--radius); font-weight:800; color:var(--muted); min-height:44px}
.tab.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.rows{display:grid; gap:10px}
.row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
.row.edit{display:grid}
.mini-cover{width:36px; height:48px; border-radius:4px 7px 7px 4px; background:hsl(var(--h) 42% 42%); flex:none; box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
.ages{display:flex; gap:8px; align-items:center}
.agesel{display:flex; align-items:center; gap:6px; font-weight:600}
.agesel select{width:auto; min-height:40px; padding:6px 8px}
.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px}
.stat{background:var(--surface-2); border-radius:12px; padding:12px; display:grid; gap:2px}
.stat b{font-size:28px; font-family:var(--font-display); font-variant-numeric:tabular-nums}
.stat span{font-size:13px; color:var(--muted); font-weight:700}
.kidprog{display:grid; gap:14px}
.kidprog header{display:flex; align-items:center; gap:12px}
.wordlist{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.wordlist li{display:grid; gap:2px; padding:10px 12px; background:var(--surface-2); border-radius:10px}
.wordlist b{font-size:17px}

/* kid home */
.home{display:grid; gap:20px}
.khead{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.khead h1{font-size:clamp(24px, 4vw, 34px)}
.toprow{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:16px}
.cont{display:flex; gap:16px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:calc(var(--radius) + 6px); padding:16px; box-shadow:var(--shadow)}
.cont .info{display:grid; gap:8px; min-width:0; flex:1}
.cont h2{font-size:21px}
.bar{height:10px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--second); border-radius:99px}
.week{background:var(--surface); border:1px solid var(--line); border-radius:calc(var(--radius) + 6px); padding:16px; display:grid; gap:12px; box-shadow:var(--shadow)}
.week h3{font-size:17px}
.days{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; text-align:center}
.day{display:grid; gap:4px; justify-items:center; font-size:12px; font-weight:800; color:var(--muted)}
.day i{width:30px; height:30px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; font-style:normal; font-size:15px}
.day.on i{background:var(--second); border:2px solid var(--second); color:var(--on-second)}
.day.today span{color:var(--ink)}
.pdays{display:grid; gap:8px}
.pdays .days{max-width:420px}
.pdays button.day{padding:0; background:none; border:0; cursor:pointer; font:inherit}
.pdays button.day:disabled{cursor:default; opacity:.35}
.pdays .day.hand i{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--line)}
.shelf{display:grid; grid-template-columns:repeat(auto-fill, minmax(156px, 1fr)); gap:18px}
.bookbtn{display:grid; gap:8px; text-align:left}
.cover{--h:210; aspect-ratio:3/4; max-width:100%; border-radius:6px 12px 12px 6px; padding:14px 12px 12px 18px; background:hsl(var(--h) 45% 38%);
  color:#FFFFFF; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;
  box-shadow:inset 7px 0 0 rgba(0,0,0,.2), 0 6px 14px rgba(0,0,0,.15)}
.cover .cvart{position:absolute; left:0; right:0; bottom:0; width:100%; height:auto; display:block}
.cover.img{padding:0; background:var(--surface-2)}
.cover.img img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.cover b{font-family:'Unbounded','Nunito',sans-serif; font-weight:700; font-size:16px; line-height:1.15; position:relative; z-index:1; overflow-wrap:anywhere; margin-bottom:auto}
.cover > span:not(.cvart){margin-top:6px}
.cover span{font-size:12px; font-weight:700; opacity:.85; position:relative; z-index:1}
.cover.sm{width:84px; flex:none; padding:8px 6px 8px 12px}
.cover.sm b{font-size:11px}
.bookbtn .meta{font-size:14px; color:var(--muted); font-weight:700}
.badge{display:inline-block; padding:2px 8px; border-radius:99px; background:var(--second); color:var(--on-second); font-size:12px; font-weight:800}
.empty{padding:26px; text-align:center; color:var(--muted); background:var(--surface); border:1.5px dashed var(--line); border-radius:var(--radius); display:grid; gap:6px}
.empty b{color:var(--ink); font-size:17px}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px}
.dict{display:grid; gap:10px; margin:0; padding:0; list-style:none}
.dict li{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:4px}
.dict li b{font-size:19px; font-family:var(--font-read)}
.dict .src{font-size:12px; color:var(--muted); font-weight:700}
.dictsearch{width:100%; margin-bottom:12px}
.dictmore{justify-self:center; margin-top:4px}
.wbook{border-top:1px solid var(--line); padding:10px 0}
.wbook summary{cursor:pointer; font-weight:800; list-style-position:inside}
.wbook summary .muted{font-weight:600}
.wbook .wordlist{margin-top:10px}

/* how far the chest is: a thin line under the reader bar */
.rprog{position:absolute; left:0; right:0; bottom:0; height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden}
.rprog i{display:block; height:100%; width:0; background:var(--gold); transition:width .2s}
/* chest gate in reader text */
.chest-gate{display:flex; flex-direction:column; align-items:center; gap:8px; padding:28px 0 14px}
.chest-gate-btn{display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 24px; border-radius:var(--radius); background:color-mix(in srgb,var(--gold) 14%,var(--surface)); border:1.5px solid color-mix(in srgb,var(--gold) 60%,var(--line)); font-weight:800; font-size:15px; color:var(--ink); cursor:pointer; min-height:auto}
.chest-gate-btn svg{width:52px; height:auto; display:block; margin:0 auto}
.chest-gate-btn:hover{background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.fire-tag{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ff6b2b,#ff9500);color:#fff;font-weight:800;font-size:13px;padding:5px 14px;border-radius:20px;box-shadow:0 2px 10px rgba(255,107,43,.4);animation:fire-pulse 2s ease-in-out infinite}
@keyframes fire-pulse{0%,100%{box-shadow:0 2px 10px rgba(255,107,43,.4)}50%{box-shadow:0 2px 20px rgba(255,107,43,.7),0 0 0 3px rgba(255,107,43,.2)}}
.kstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.kstat{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.kstat b{font-size:22px;font-weight:800;line-height:1.1}
.kstat span{font-size:13px;color:var(--muted)}
.kstat.hot{background:linear-gradient(135deg,color-mix(in srgb,#ff6b2b 22%,var(--surface)),color-mix(in srgb,#ff9500 14%,var(--surface)))}
.bank-badge{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--ok) 16%,var(--surface));border:1.5px solid color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ink);font-weight:800;padding:6px 16px;border-radius:99px}
.fire-chest{filter:drop-shadow(0 0 18px rgba(255,120,40,.7))}

/* kid chips on prize rows */
.kidchips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.kidchip{padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:none;cursor:pointer;color:var(--muted);transition:all .15s}
.kidchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* prizes */
.medal{--h:200; width:56px; height:56px; border-radius:50%; flex:none; display:grid; place-items:center; color:#FFFFFF; font-family:'Unbounded','Nunito',sans-serif; font-weight:700; font-size:24px;
  background:radial-gradient(circle at 30% 30%, hsl(var(--h) 60% 58%), hsl(var(--h) 55% 36%)); box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.t1{--tc:var(--muted)} .t2{--tc:var(--second)} .t3{--tc:var(--epic)} .t4{--tc:var(--gold)}
.prize{position:relative; display:grid; justify-items:center; gap:8px; text-align:center; padding:22px 24px 20px; border-radius:24px; background:var(--surface); border:3px solid var(--tc, var(--line)); box-shadow:0 0 0 7px color-mix(in srgb, var(--tc, var(--line)) 16%, transparent); width:min(440px, 100%); overflow:hidden}
.prize.t4{background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--gold) 28%, var(--surface)), var(--surface) 70%)}
.prize .ptier{font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--tc)}
.prize .fish svg{width:150px; height:auto; display:block}
.prize .ptext{font-family:var(--font-display); font-size:clamp(24px, 4vw, 30px); line-height:1.15}
.prize .pann{font-size:17px; max-width:36ch}
.prize .pclaim{font-size:13px; color:var(--muted); font-weight:700}
.meme{display:grid; width:min(440px, 100%); border-radius:16px; overflow:hidden; background:#16181D; color:#FFFFFF; text-align:center; box-shadow:var(--shadow)}
.meme .mt{padding:16px 16px 6px; font-family:'Unbounded','Nunito',sans-serif; font-weight:700; font-size:clamp(18px, 3.4vw, 22px); text-transform:uppercase; line-height:1.15}
.meme .mi svg{width:180px; height:auto; margin:0 auto; display:block}
.meme .mb{padding:6px 18px 18px; font-size:17px; font-weight:700}
.meme .mtag{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#9AA2B3; padding-top:10px}
.three{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; width:min(560px, 100%)}
.three .chest{width:100%}
.three .chest[disabled]{opacity:.35}
.others{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; font-size:14px; color:var(--muted)}
.others span{background:var(--surface-2); border-radius:99px; padding:4px 12px}
.plist{display:grid; gap:10px; margin:0; padding:0; list-style:none}
.plist li{display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 14px; background:var(--surface); border:2px solid color-mix(in srgb, var(--tc) 45%, var(--line)); border-radius:14px}
.plist .fishmini svg{width:56px; height:auto; display:block}
.plist .ptier{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--tc)}
.plist b{font-size:18px}
.additem{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:end}
.additem select{width:auto}
.additem input[type=number]{width:120px}

  token: null,

  init(){
    try { this.token = localStorage.getItem('chitalka:token'); this.email = localStorage.getItem('chitalka:email'); } catch (e) {}
    const self = this;
    this.sample = {
      async json(prompt, opts){
        const res = await self.req('/api/ai/json', {method:'POST', body:JSON.stringify({prompt, tier:opts && opts.modelTier || 'default'})});
        if (!res.ok){ const err = await res.json().catch(() => ({})); throw {code: err.error || 'ai_error', message: err.error}; }
        return res.json();
      }
    };
  },
  async req(url, opts = {}){
    const headers = Object.assign({'Authorization':'Bearer ' + this.token}, opts.body ? {'Content-Type':'application/json'} : {});
    const res = await fetch(url, Object.assign({}, opts, {headers}));
    if (res.status === 401){ this.forget(); location.reload(); throw new Error('auth'); }
    return res;
  },
  remember(token, email){
    this.token = token; this.email = email;
    try { localStorage.setItem('chitalka:token', token); localStorage.setItem('chitalka:email', email); localStorage.removeItem('chitalka:fid'); } catch (e) {}
  },
  forget(){
    this.token = null; this.email = null;
    try { localStorage.removeItem('chitalka:token'); localStorage.removeItem('chitalka:email'); } catch (e) {}
  },
  async get(id){
    const res = await this.req('/api/db/' + encodeURIComponent(id));
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('Ошибка чтения данных');
    return res.json();
  },
  queue(id, fn){
    const p = (this.chains[id] || Promise.resolve()).catch(() => {}).then(fn);
    this.chains[id] = p; return p;
  },
  set(id, data){
    return this.queue(id, async () => {
      const res = await this.req('/api/db/' + encodeURIComponent(id), {method:'POST', body:JSON.stringify(data)});
      if (!res.ok) throw new Error('Ошибка сохранения');
    });
  },
  del(id){
    return this.queue(id, async () => { await this.req('/api/db/' + encodeURIComponent(id), {method:'DELETE'}); });
  },
  async books(){
    const res = await this.req('/api/books');
    if (!res.ok) return [];
    return res.json();
  }
};

// Two devices (or an old tab) can hold different copies of a child's progress.
// Saving merges with what is stored instead of overwriting it, so nothing read, earned or given gets lost.
function mergeKd(server, local){
  if (!server) return local;
  const sv = normKd(server), m = normKd(JSON.parse(JSON.stringify(local)));
  const uniq = (a, b, key) => { const seen = new Map(); a.concat(b).forEach(x => { const k = key(x); if (!seen.has(k)) seen.set(k, x); }); return [...seen.values()]; };
  // Days: union of both copies, then the newest mark per day wins (a parent can add or remove a day, reading again re-adds it)
  const days = new Set(sv.stats.days.concat(m.stats.days));
  for (const [d, x] of Object.entries(sv.dayMarks)) if (!m.dayMarks[d] || m.dayMarks[d].at < x.at) m.dayMarks[d] = x;
  for (const [d, x] of Object.entries(m.dayMarks)) x.on ? days.add(d) : days.delete(d);
  m.stats.days = [...days].sort().slice(-90);
  const oldest = m.stats.days[0] || dayStr();
  for (const d of Object.keys(m.dayMarks)) if (d < oldest && daysAgo(d) > 90) delete m.dayMarks[d];
  for (const f of ['q', 'ok', 'chapters']) m.stats[f] = Math.max(sv.stats[f] || 0, m.stats[f] || 0);
  m.log = [...new Set(sv.log.concat(m.log))].sort((a, b) => a - b).slice(-200);
  // Piggy bank: earnings and payouts are a ledger, the balance follows from it
  const lastPaid = x => Math.max(0, ...(x.bankPaid || []).map(e => e.at));
  const localLog = new Set((m.bankLog || []).map(e => e.at)), localPaid = lastPaid(m);
  m.bankLog = uniq(m.bankLog || [], sv.bankLog || [], e => e.at).sort((a, b) => a.at - b.at).slice(-200);
  m.bankPaid = uniq(m.bankPaid || [], sv.bankPaid || [], e => e.at).sort((a, b) => a.at - b.at).slice(-100);
  const paid = lastPaid(m), sum = list => list.reduce((n, e) => n + (e.n || 0), 0);
  m.bank = paid > localPaid ? sum(m.bankLog.filter(e => e.at > paid))
    : (m.bank || 0) + sum((sv.bankLog || []).filter(e => !localLog.has(e.at) && e.at > paid));
  m.prizes = uniq(m.prizes, sv.prizes, x => x.id).map(x => { const o = sv.prizes.find(y => y.id === x.id); return o && o.given && !x.given ? {...x, given:true, givenAt:o.givenAt} : x; })
    .sort((a, b) => b.at - a.at).slice(0, 200);
  m.quizLog = uniq(m.quizLog, sv.quizLog, x => x.id).map(x => { const o = sv.quizLog.find(y => y.id === x.id); return o && o.credited && !x.credited ? {...x, credited:o.credited} : x; })
    .sort((a, b) => b.at - a.at).slice(0, 30);
  m.words = uniq(m.words, sv.words, w => w.raw + '|' + w.bookId).sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 1500);
  const svNewer = (sv.lastReadAt || 0) > (m.lastReadAt || 0);
  for (const id of Object.keys(sv.books)){
    const a = sv.books[id], b = m.books[id];
    if (!b){ m.books[id] = a; continue; }
    const fails = Object.assign({}, a.fails), chances = Object.assign({}, a.chances);
    Object.entries(b.fails || {}).forEach(([k, v]) => { fails[k] = Math.max(fails[k] || 0, v); });
    Object.entries(b.chances || {}).forEach(([k, v]) => { chances[k] = Math.max(chances[k] || 0, v); });
    m.books[id] = Object.assign({}, b, {globalWordsRead:Math.max(a.globalWordsRead || 0, b.globalWordsRead || 0), done:[...new Set((a.done || []).concat(b.done || []))],
      finished:!!(a.finished || b.finished), fails, chances, pos:svNewer && a.pos != null ? a.pos : b.pos});
  }
  if (svNewer){ m.last = sv.last; m.lastReadAt = sv.lastReadAt; }
  if ((sv.fireDay || '') > (m.fireDay || '')) m.fireDay = sv.fireDay;
  return m;
}

}

const cleanQs = list => (Array.isArray(list) ? list : []).filter(q =>
  q && typeof q.q === 'string' && Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length
).map(q => ({q:q.q, options:q.options.map(String), answer:q.answer, hint:String(q.hint || ''), quote:String(q.quote || '')}));
// A line of dialogue: starts with a dash
const isTalk = p => typeof p === 'string' && /^\s*[—–-]/.test(p);
// Where today's chest stands: always at the end of a paragraph, near the word goal.
// A chapter end soon after the goal wins; otherwise the first paragraph past the goal that doesn't cut a dialogue.
async function findGate(book, from){
  const goal = wordsPerChest(S.kid), total = bookTotalWords(book), ends = [];
  if (from >= total) return null;
  for (let c = chAt(book, from), start = chWordStart(book, c); c < book.chapters.length; start += book.chapters[c].words || 0, c++){
    const paras = await chapterParas(book, c);
    let w = start, last = null;
    paras.forEach((p, i) => {
      w += countWords([p]);
      if (w > from && typeof p === 'string' && p.trim()) ends.push(last = {at:w, ch:c, talk:isTalk(p) || isTalk(paras[i + 1])});
    });
    if (last) last.chEnd = true;
    if (w - from >= goal * 1.5) break;
  }
  const read = e => e.at - from;
  // Never less than the goal (only the end of the book can make a sitting shorter)
  let gate = ends.find(e => e.chEnd && read(e) >= goal && read(e) <= goal * 1.5)
    || ends.find(e => read(e) >= goal && read(e) <= goal * 1.3 && !e.talk)
    || ends.find(e => read(e) >= goal)
    || ends[ends.length - 1];
  if (!gate) return {from, to:total, ch:book.chapters.length - 1};
  // A short chapter tail is read now, so nobody comes back for two sentences
  const tail = ends.find(e => e.ch === gate.ch && e.chEnd);
  if (tail && tail.at - gate.at < 150) gate = tail;
  return {from, to:gate.at, ch:gate.ch};
}
// Paragraphs of the book between two global word positions, across chapter borders
async function textBetween(book, from, to){
  const out = [];
  for (let c = 0, start = 0; c < book.chapters.length && start < to; start += book.chapters[c].words || 0, c++){
    const end = start + (book.chapters[c].words || 0);
    if (end <= from) continue;
    let w = start;
    for (const p of await chapterParas(book, c)){
      const n = countWords([p]);
      if (typeof p === 'string' && w + n > from && w < to) out.push(p);
      w += n;
    }
  }
  return out.join('\n');
}
// Tolerant text match: lower case, ё→е, letters and digits only
const normTxt = t => String(t).toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]+/g, ' ').trim();
// The quote must really be in what the child read: whole, or at least four words in a row
function quoteFound(quote, normText){
  const q = normTxt(quote).split(' ').filter(Boolean);
  if (q.length < 3) return false;
  if (normText.includes(q.join(' '))) return true;
  for (let i = 0; i + 4 <= q.length; i++) if (normText.includes(q.slice(i, i + 4).join(' '))) return true;
  return false;
}
// The model names the right answer as text (not a number it can get wrong); the app shuffles the options later.
// Questions about numbers and passing details are dropped while enough good ones remain.
function readQs(list, normText, k){
  let qs = (Array.isArray(list) ? list : []).filter(x => x && typeof x.q === 'string' && typeof x.right === 'string' && Array.isArray(x.wrong) && x.wrong.length >= 2)
    .map(x => ({q:x.q, options:[x.right].concat(x.wrong.slice(0, 3)).map(String), answer:0, hint:String(x.hint || ''), quote:String(x.quote || ''), weight:+x.importance || 2}))
    .filter(x => new Set(x.options.map(normTxt)).size === x.options.length);
  const keep = f => { const left = qs.filter(f); if (left.length >= Math.min(k, 4)) qs = left; };
  keep(x => quoteFound(x.quote, normText));
  keep(x => !x.options.every(o => /\d/.test(o)));
  keep(x => x.weight >= 2);
  if (qs.length > k) qs = qs.filter(x => x.weight >= 3).length >= k ? qs.filter(x => x.weight >= 3) : qs;
  return qs.slice(0, k).map(({weight, ...x}) => x);
}

/* ---------- import: TXT, FB2, EPUB ---------- */
function decodeText(buf){
  let t;
  try { t = new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch (e) { t = new TextDecoder('windows-1251').decode(buf); }
  return t.replace(/^﻿/, '');
}
function decodeXml(buf){
  const head = new TextDecoder('latin1').decode(new Uint8Array(buf).slice(0, 300));
  const m = head.match(/encoding=["']([\w-]+)["']/i);
  const enc = m ? m[1].toLowerCase() : 'utf-8';
  try { return new TextDecoder(enc).decode(buf).replace(/^﻿/, ''); } catch (e) { return decodeText(buf); }
}
const baseName = n => n.replace(/^.*[\\/]/, '').replace(/\.(fb2\.zip|txt|fb2|epub|zip)$/i, '').replace(/[_]+/g, ' ').trim();
const nodeText = el => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();
function parseTxt(text, title){
  text = text.replace(/\r\n?/g, '\n');
  let blocks = text.split(/\n[ \t]*\n+/);
  if (blocks.length < 4) blocks = text.split('\n');
  const paras = blocks.map(b => b.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
  const HEAD = /^((глава|часть|chapter|рассказ)\s+([0-9]+|[ivxlcdm]+|[а-яё]+)\b.{0,80}|[ivxlcdm]{1,7}\.?|\d{1,3}\.?)$/i;
  const chapters = []; let cur = {title:'', paras:[]};
  for (const p of paras){
    if (p.length < 90 && HEAD.test(p)){ if (cur.paras.length) chapters.push(cur); cur = {title:p, paras:[]}; }
    else cur.paras.push(p);
  }
  if (cur.paras.length) chapters.push(cur);
  return {title, author:'', chapters};
}
function parseFb2(xml){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('файл FB2 повреждён');
  const byName = (root, name) => root ? Array.from(root.getElementsByTagName('*')).filter(e => e.localName === name) : [];
  const ti = byName(doc, 'title-info')[0];
  const title = nodeText(byName(ti, 'book-title')[0]) || 'Без названия';
  const a = byName(ti, 'author')[0];
  const author = a ? ['first-name', 'middle-name', 'last-name'].map(n => nodeText(byName(a, n)[0])).filter(Boolean).join(' ') : '';
  const bodies = Array.from(doc.getElementsByTagName('*')).filter(e => e.localName === 'body' && !e.getAttribute('name'));
  const chapters = [];
  function walk(sec, parentTitle){
    const kids = Array.from(sec.children);
    const tEl = kids.find(k => k.localName === 'title');
    const own = tEl ? Array.from(tEl.children).map(nodeText).filter(Boolean).join('. ') || nodeText(tEl) : '';
    const t = own || parentTitle || '';
    let buf = [];
    const flush = () => { if (buf.length){ chapters.push({title:t, paras:buf}); buf = []; } };
    for (const k of kids){
      const n = k.localName;
      if (n === 'p' || n === 'subtitle') buf.push(nodeText(k));
      else if (n === 'poem' || n === 'cite' || n === 'epigraph') Array.from(k.getElementsByTagName('*')).forEach(e => { if (e.localName === 'p' || e.localName === 'v') buf.push(nodeText(e)); });
      else if (n === 'section'){ flush(); walk(k, own ? '' : parentTitle); }
    }
    flush();
  }
  bodies.forEach(b => walk(b, ''));
  let cover = null;
  const cimg = byName(byName(ti, 'coverpage')[0], 'image')[0];
  if (cimg){
    const ref = (cimg.getAttribute('l:href') || cimg.getAttribute('xlink:href') || Array.from(cimg.attributes).map(x => x.value).find(v => v.startsWith('#')) || '').replace(/^#/, '');
    const bin = byName(doc, 'binary').find(e => e.getAttribute('id') === ref);
    if (bin) cover = `data:${bin.getAttribute('content-type') || 'image/jpeg'};base64,${bin.textContent.replace(/\s+/g, '')}`;
  }
  return {title, author, chapters, cover};
}
// Shrinks a cover to a small JPEG so it can live inside the book record
async function shrinkCover(src){
  try {
    const im = new Image(); im.src = src; await im.decode();
    const w = Math.min(360, im.naturalWidth), h = Math.round(im.naturalHeight * w / im.naturalWidth);
    if (!w || !h || h / w > 3 || w / h > 2) return null;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', .82);
  } catch (e) { return null; }
}
function joinPath(base, href){
  const out = [];
  (base + href.split('#')[0]).split('/').forEach(p => { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); });
  return out.join('/');
}
async function epubReadImg(zip, base, src){
  try {
    const rel = src.split('?')[0];
    const p = joinPath(base, decodeURIComponent(rel));
    const f = zip.file(p) || zip.file(joinPath(base, rel));
    if (!f) return null;
    const b64 = await f.async('base64');
    const lo = rel.toLowerCase();
    const mime = lo.endsWith('.png') ? 'image/png' : lo.endsWith('.gif') ? 'image/gif' : lo.endsWith('.webp') ? 'image/webp' : 'image/jpeg';
    return {img: `data:${mime};base64,${b64}`};
  } catch { return null; }
}
const EPUB_BLOCKS = new Set(['p','div','section','article','li','dd','dt','td','th','h1','h2','h3','h4','h5','h6','blockquote','figcaption','pre']);
// Сбрасывает накопленный текст в абзац. Короткие строки без букв (номера страниц) отбрасываются,
// короткие заголовки тоже — они уже есть в названии главы.
function epubFlush(out, textBuf){
  const t = textBuf.t.replace(/\s+/g, ' ').trim();
  textBuf.t = '';
  if (!t || !/[A-Za-zА-Яа-яЁё]/.test(t)) return;
  if (textBuf.heading && (t.length <= 20 || countWords([t]) < 4)) return;
  out.push(t);
}
async function epubWalkContent(node, zip, base, out, textBuf){
  if (node.nodeType === 3){ textBuf.t += node.textContent; return; }
  if (node.nodeType !== 1) return;
  const tag = node.localName ? node.localName.toLowerCase() : '';
  if (['script','style','head'].includes(tag)) return;
  if (tag === 'br'){ epubFlush(out, textBuf); return; }
  if (tag === 'img'){
    const s = node.getAttribute('src');
    if (s){
      epubFlush(out, textBuf);
      const item = await epubReadImg(zip, base, s);
      if (item) out.push(item);
    }
    return;
  }
  if (!EPUB_BLOCKS.has(tag)){
    for (const c of node.childNodes) await epubWalkContent(c, zip, base, out, textBuf);
    return;
  }
  epubFlush(out, textBuf);
  const wasHeading = textBuf.heading;
  if (/^h[1-6]$/.test(tag)) textBuf.heading = true;
  for (const c of node.childNodes) await epubWalkContent(c, zip, base, out, textBuf);
  epubFlush(out, textBuf);
  textBuf.heading = wasHeading;
}
async function parseEpub(buf){
  if (typeof JSZip === 'undefined') throw new Error('не загрузился модуль для EPUB, обновите страницу');
  const zip = await JSZip.loadAsync(buf);
  const contF = zip.file('META-INF/container.xml');
  if (!contF) throw new Error('файл EPUB повреждён');
  const xmlp = s => new DOMParser().parseFromString(s, 'application/xml');
  const cont = xmlp(await contF.async('string'));
  const rf = Array.from(cont.getElementsByTagName('*')).find(e => e.localName === 'rootfile');
  const opfPath = rf.getAttribute('full-path');
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const opf = xmlp(await zip.file(opfPath).async('string'));
  const all = Array.from(opf.getElementsByTagName('*'));
  const title = nodeText(all.find(e => e.localName === 'title')) || 'Без названия';
  const author = nodeText(all.find(e => e.localName === 'creator'));
  const manifest = {};
  const items = all.filter(e => e.localName === 'item');
  items.forEach(e => { manifest[e.getAttribute('id')] = e.getAttribute('href'); });
  const isImg = e => /^image\//.test(e.getAttribute('media-type') || '') || /\.(jpe?g|png|gif|webp)$/i.test(e.getAttribute('href') || '');
  const metaCover = all.find(e => e.localName === 'meta' && e.getAttribute('name') === 'cover');
  const coverItem = items.find(e => /\bcover-image\b/.test(e.getAttribute('properties') || ''))
    || (metaCover && items.find(e => e.getAttribute('id') === metaCover.getAttribute('content') && isImg(e)))
    || items.find(e => isImg(e) && /cover|obloz/i.test((e.getAttribute('id') || '') + (e.getAttribute('href') || '')));
  const coverImg = coverItem ? await epubReadImg(zip, base, coverItem.getAttribute('href')) : null;
  const spine = all.filter(e => e.localName === 'itemref').map(e => manifest[e.getAttribute('idref')]).filter(Boolean);
  const chapters = [];
  for (const href of spine){
    const p = joinPath(base, href);
    const f = zip.file(p) || zip.file(decodeURIComponent(p));
    if (!f) continue;
    const html = await f.async('string');
    let d = new DOMParser().parseFromString(html, 'application/xhtml+xml');
    if (d.getElementsByTagName('parsererror').length) d = new DOMParser().parseFromString(html, 'text/html');
    const h = d.querySelector('h1, h2, h3');
    const body = d.querySelector('body') || d.documentElement;
    const paras = [];
    const buf = {t:'', heading:false};
    await epubWalkContent(body, zip, base, paras, buf);
    epubFlush(paras, buf);
    const words = countWords(paras);
    if (words < 40) continue;
    // Оглавление: большая часть текста — ссылки
    const linkWords = countWords(Array.from(body.querySelectorAll('a')).map(a => a.textContent));
    if (linkWords >= words * 0.5) continue;
    const title = nodeText(h), tl = title.toLowerCase();
    const body2 = paras.filter((p, i) => !(i < 3 && typeof p === 'string' && tl && tl.includes(p.toLowerCase())));
    chapters.push({title, paras:body2});
  }
  return {title, author, chapters, cover:coverImg && coverImg.img};
}
function splitParas(paras){
  const out = [];
  paras.forEach(p => {
    if (typeof p !== 'string'){ out.push(p); return; }
    if (countWords([p]) <= 320){ out.push(p); return; }
    const sents = p.split(/(?<=[.!?…])\s+/);
    let cur = '';
    sents.forEach(s => { if (cur && countWords([cur + ' ' + s]) > 150){ out.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s; });
    if (cur) out.push(cur);
  });
  return out;
}
function filterMetaChapters(chs){
  const META_TITLE = /^(annotation|аннотация|copyright|copyrights|содержание|оглавление|обложка|cover|title\s*page?|titlepage|колофон|colophon|от\s+издателя|от\s+автора\s*$)$/i;
  const META_RE = /©|ISBN|издательств|все права защищены|правообладател|\bpublisher\b|\bcopyright\b/i;
  return chs.filter((c, i) => {
    if (META_TITLE.test((c.title || '').trim())) return false;
    if (i > 2) return true;
    const textParas = (c.paras || []).filter(p => typeof p === 'string');
    const text = textParas.join(' ');
    if (META_RE.test(text) && textParas.length <= 8) return false;
    return true;
  });
}
function finalizeChapters(chs){
  const out = [];
  chs.forEach(c => {
    const paras = splitParas(c.paras.map(p => typeof p === 'string' ? p.replace(/\s+/g, ' ').trim() : p).filter(p => typeof p !== 'string' || p));
    if (countWords(paras) < 5) return;
    const title = (c.title || '').replace(/\s+/g, ' ').trim().slice(0, 120);
    if (countWords(paras) <= 2200){ out.push({title, paras}); return; }
    let part = [], pw = 0, k = 1;
    paras.forEach(p => {
      const w = countWords([p]);
      if (pw + w > 1600 && part.length){ out.push({title, part:k++, paras:part}); part = []; pw = 0; }
      part.push(p); pw += w;
    });
    if (part.length) out.push({title, part:k > 1 ? k : 0, paras:part});
  });
  return out.map((c, i) => ({title:(c.title || 'Глава ' + (i + 1)) + (c.part ? ' · часть ' + c.part : ''), paras:c.paras}));
}
function setImport(msg){ S.importMsg = msg; const el = $('#importStatus'); if (el) el.textContent = msg; }
async function saveBook(book){
  const chs = finalizeChapters(filterMetaChapters(book.chapters || []));
  if (!chs.length) throw new Error('в файле не нашлось текста. Возможно, книга защищена DRM или состоит из картинок — попробуй другой файл');
  if (chs.length > 500) throw new Error('книга слишком большая для этой версии');
  const id = newId();
  const meta = {kind:'book', id, title:String(book.title || 'Без названия').slice(0, 160), author:String(book.author || '').slice(0, 120), ageMin:5, ageMax:16,
    chapters:chs.map(c => ({title:c.title.slice(0, 140), words:countWords(c.paras)})), addedAt:Date.now()};
  if (book.cover){ const c = await shrinkCover(book.cover); if (c) meta.cover = c; }
  for (let i = 0; i < chs.length; i++){
    setImport('Сохраняю главы: ' + (i + 1) + ' из ' + chs.length + '…');
    await Store.set('bch_' + id + '_' + i, {kind:'chapter', book:id, i, paras:chs[i].paras});
  }
  await Store.set('book_' + id, meta);
  S.books.push(meta);
  S.importMsg = 'Книга «' + meta.title + '» добавлена: ' + chs.length + ' ' + plural(chs.length, 'глава', 'главы', 'глав') + '. По умолчанию её видят дети 5–16 лет.';
  S.paste = false;
  render();
}
async function importFile(file){
  setImport('Читаю «' + file.name + '»…');
  try {
    const name = file.name.toLowerCase(), buf = await file.arrayBuffer();
    let book;
    if (name.endsWith('.epub')) book = await parseEpub(buf);
    else if (name.endsWith('.zip')){
      if (typeof JSZip === 'undefined') throw new Error('не загрузился модуль для архивов, обновите страницу');
      const zip = await JSZip.loadAsync(buf);
      const f = Object.values(zip.files).find(x => !x.dir && /\.(fb2|txt|epub)$/i.test(x.name));
      if (!f) throw new Error('в архиве нет файла FB2, TXT или EPUB');
      const inner = await f.async('arraybuffer');
      book = /\.fb2$/i.test(f.name) ? parseFb2(decodeXml(inner)) : /\.epub$/i.test(f.name) ? await parseEpub(inner) : parseTxt(decodeText(inner), baseName(f.name));
    }
    else if (name.endsWith('.fb2')) book = parseFb2(decodeXml(buf));
    else if (name.endsWith('.txt')) book = parseTxt(decodeText(buf), baseName(file.name));
    else throw new Error('этот формат пока не поддерживается, подойдут TXT, FB2 и EPUB');
    await saveBook(book);
  } catch (e) {
    setImport('Не получилось добавить книгу: ' + ((e && e.message) || 'ошибка чтения файла') + '.');
  }
}

const AUTH_ERR = {bad_email:'Проверьте адрес почты.', wait:'Код уже отправлен. Новый можно запросить через минуту.', too_many:'Слишком много попыток. Попробуйте через час.',

async function authCall(path, body){
  const res = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).catch(() => null);
  const d = res ? await res.json().catch(() => ({})) : {};
  if (!res || !res.ok) throw new Error(AUTH_ERR[d.error] || 'Не получилось связаться с сервером. Попробуйте ещё раз.');
  return d;
}
async function loginSend(email){
  const L = S.login;
  L.email = email.trim(); L.err = ''; L.busy = true; render();
  try { const d = await authCall('/api/auth/start', {email:L.email}); L.step = 'code'; L.devCode = d.devCode || ''; }
  catch (e) { L.err = e.message; }
  L.busy = false; render();
  const f = $(L.step === 'code' ? '#loginCode' : '#loginEmail'); if (f) f.focus();
}

function weekDays(){
  const now = new Date(), dow = (now.getDay() + 6) % 7, res = [];
  for (let i = 0; i < 7; i++){ const d = new Date(now); d.setDate(now.getDate() - dow + i); res.push({s:dayStr(d), l:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i], today:i === dow}); }
  return res;
}
// Last week and this week, Monday first
function twoWeeks(){
  const now = new Date(), dow = (now.getDay() + 6) % 7, res = [];
  for (let i = 0; i < 14; i++){ const d = new Date(now); d.setDate(now.getDate() - dow - 7 + i); res.push({s:dayStr(d), l:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i % 7], n:d.getDate(), today:i - 7 === dow, future:i - 7 > dow}); }
  return res;
}
function parentDays(k, d){

  const cell = x => { const on = st.days.includes(x.s), hand = d.dayMarks[x.s] && d.dayMarks[x.s].hand;
    return `<button class="day${on ? ' on' : ''}${x.today ? ' today' : ''}${hand ? ' hand' : ''}" data-act="toggleDay" data-kid="${k.id}" data-day="${x.s}" ${x.future ? 'disabled' : ''} aria-pressed="${on}" aria-label="${x.l} ${x.n}: ${on ? 'читал(а), снять отметку' : 'не читал(а), отметить'}"><i>${on ? '✓' : ''}</i><span>${x.l} ${x.n}</span></button>`; };

// The paragraph (or chapter title) where a word position starts
function elAt(pos){
  let el = null;
  for (const e of document.querySelectorAll('.page [data-g]')){ const g = +e.dataset.g; if (g > pos) break; if (!el || g > +el.dataset.g) el = e; }
  return el;
}
const readerTop = () => { const h = $('.rbar'); return (h ? h.getBoundingClientRect().bottom : 0) + 12; };
// The first paragraph not hidden under the sticky bar
function topVisible(){
  const els = document.querySelectorAll('.page [data-g]'), top = readerTop();
  let lo = 0, hi = els.length - 1;

  return els[lo] || null;
}
function scrollToPos(pos){
  const el = elAt(pos);

  window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - readerTop());
}
// Re-render without the text jumping: the paragraph at the top stays at the top
function keepPlace(fn){

  if (b) window.scrollBy(0, b.getBoundingClientRect().top - off);
}

// Where the answer to a question sits in today's text, and a place 5–6 sentences above it to start rereading from
function quoteSpot(quote){
  const r = S.reader, list = [];
  if (!quote || !r || !r.ready) return null;
  for (let c = r.from; r.chs[c]; c++){
    let g = chWordStart(r.book, c);

  }
  const from = r.gate ? r.gate.from : 0;

const failedAttempts = (bookId, ch) => (((S.kd.books[bookId] || {}).fails || {})[ch]) || 0;
// After a failed quiz the rest of the book waits until a parent gives another try
const quizLocked = (bookId, from) => failedAttempts(bookId, from) > ((((S.kd.books[bookId] || {}).chances || {})[from]) || 0);
async function startQuiz(){
  const r = S.reader, g = r.gate;
  if (!g) return;
  // Resume in-progress quiz if it's for the same stretch of text
  if (S.quiz && S.quiz.qs && !S.quiz.finished && S.quiz.bookId === r.book.id && S.quiz.from === g.from){ go('quiz'); return; }
  if (quizLocked(r.book.id, g.from)){ go('reader'); return; }
  const attempt = failedAttempts(r.book.id, g.from);
  S.quiz = {loading:true};
  go('quiz');
  try {
    const doc = await getQuiz(r.book, g);
    // Questions follow the story; only the answers are shuffled
    const qs = doc.questions.map(q => {
      const order = shuffle(q.options.map((_, i) => i));
      return {q:q.q, hint:q.hint, quote:q.quote || '', options:order.map(i => q.options[i]), answer:order.indexOf(q.answer)};
    });
    S.quiz = {qs, idx:0, wrong:[], solved:false, missed:false, firstOk:0, praise:'', totalWrong:0, log:[], bookId:r.book.id, from:g.from, to:g.to, attempt:attempt + 1};
  } catch (e) {
    S.quiz = {error:aiErr(e)};
  }
  if (S.screen === 'quiz') render();
}
function completeChapter(total, firstOk, countDay = true){
  const r = S.reader, b = r.book;
  const bp = S.kd.books[b.id] = S.kd.books[b.id] || {ch:0, done:[], globalWordsRead:0};
  const before = bp.globalWordsRead || 0;
  // Count exactly what was read this sitting; the next one starts right after the chest
  bp.globalWordsRead = Math.max(before, r.gate ? r.gate.to : bookTotalWords(b));
  bp.pos = bp.globalWordsRead;
  // Chapters finished in this sitting (done[] also feeds the hero chat)
  if (!bp.done) bp.done = [];
  b.chapters.forEach((c, i) => { const e = chWordStart(b, i) + (c.words || 0); if (e > before && e <= bp.globalWordsRead && !bp.done.includes(i)){ bp.done.push(i); S.kd.stats.chapters++; } });
  S.kd.log.push(Date.now()); S.kd.log = S.kd.log.slice(-200);
  bp.ch = nextUnreadCh(b);
  const totalBW = bookTotalWords(b);
  if (totalBW > 0 && bp.globalWordsRead >= totalBW){ bp.finished = true; }
  const t = dayStr();
  if (countDay){
    if (!S.kd.stats.days.includes(t)){ S.kd.stats.days.push(t); S.kd.stats.days = S.kd.stats.days.slice(-90); }
    S.kd.dayMarks[t] = {on:true, at:Date.now()};
  }
  S.kd.stats.q += total; S.kd.stats.ok += firstOk;
  S.kd.last = b.id;
  saveKd();
}
function triggerConfetti(){
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#ffd700','#ff6b35','#7c3aed','#0ea5e9','#22c55e','#f43f5e','#fb923c','#e879f9'];
  const ps = Array.from({length:130}, () => ({
    x: canvas.width * Math.random(), y: -10 - Math.random() * 120,
    vx: (Math.random() - 0.5) * 7, vy: 2 + Math.random() * 5,
    r: 4 + Math.random() * 7, c: colors[Math.floor(Math.random() * colors.length)],
    spin: (Math.random() - 0.5) * 0.35, a: Math.random() * Math.PI * 2
  }));
  let af;
  const frame = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = 0;
    ps.forEach(p => {
      if (p.y > canvas.height + 20) return; alive++;
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.a += p.spin;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, p.y - canvas.height * 0.55) / (canvas.height * 0.45));
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
    });
    if (alive > 0) af = requestAnimationFrame(frame); else canvas.remove();
  };
  af = requestAnimationFrame(frame);
  setTimeout(() => { cancelAnimationFrame(af); canvas.remove(); }, 5000);
}

async function onPin(code){
  const m = S.pinMode;
  if (m === 'setup1'){ S.setup.first = code; S.setup.step = 'pin2'; S.pinMode = 'setup2'; }
  else if (m === 'setup2'){
    if (code === S.setup.first){ S.setup.pinHash = await sha(code); S.setup.step = 'kids'; S.pinMode = null; }
    else { S.pinErr = 'PIN-коды не совпали. Придумайте заново.'; S.setup.step = 'pin1'; S.pinMode = 'setup1'; }
  }
  else if (m === 'enter'){
    if (await sha(code) === S.family.pinHash){ S.pinMode = null; S.parentTab = 'kids'; S.parentMsg = ''; S.screen = 'parent'; }
    else S.pinErr = 'Неверный PIN-код';
  }
  else if (m === 'change1'){ S.changeFirst = code; S.pinMode = 'change2'; }
  else if (m === 'change2'){
    if (code === S.changeFirst){ S.family.pinHash = await sha(code); await saveFamily(); S.pinMode = 'change1'; S.parentMsg = 'PIN-код изменён'; }
    else { S.pinErr = 'PIN-коды не совпали'; S.pinMode = 'change1'; }
  }
  S.pinBuf = '';
  render();
}

  },
  async saveBank(){
    const name = (($('#bankName') || {}).value || '').trim().slice(0, 30) || 'минут игры';
    const per = Math.max(1, Math.min(999, Math.round(+(($('#bankPer') || {}).value) || 10)));
    S.family.bank = {name, per};
    await saveFamily().then(() => toast('Сохранено')).catch(() => toast('Не получилось сохранить')); render();
  },
  async payBank(el){
    const id = el.dataset.kid, kd = normKd(S.progress[id]);
    kd.bankPaid = (kd.bankPaid || []).concat({at:Date.now(), n:kd.bank}).slice(-100);
    kd.bank = 0;
    try { S.progress[id] = await saveKidDoc(id, kd); toast('Копилка обнулена'); } catch (e) { toast('Не получилось сохранить'); }
    render();
  },
  openFire(){ openFire(); },
  loginBack(){ S.login = {step:'email', email:S.login.email, err:''}; render(); },
  loginResend(){ loginSend(S.login.email); },
  async logout(){
    try { await Store.req('/api/auth/logout', {method:'POST'}); } catch (e) {}
    Store.forget(); location.reload();
  },
  pickChest(el){ openChest(+el.dataset.i); },
};

document.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (w && S.screen === 'reader'){ explainWord(w); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn){ e.preventDefault(); Promise.resolve().then(() => fn(el, e)).catch(showFail); }
});
// A failed tap used to do nothing at all; say what broke so it can be reported
function showFail(err){
  console.error(err);
  toast('Что-то пошло не так: ' + String((err && (err.message || err.reason)) || err).slice(0, 140), 10000);
}
window.addEventListener('error', e => showFail(e.error || e.message));
window.addEventListener('unhandledrejection', e => showFail(e.reason));
document.addEventListener('input', e => {
  if (e.target.id === 'dictQ'){ S.dictQ = e.target.value; S.dictN = 0; refreshDict(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'bookFile' && t.files && t.files[0]){ importFile(t.files[0]); t.value = ''; }
  else if (t.dataset && t.dataset.kid && t.dataset.kidProp){
    const k = S.family.kids.find(x => x.id === t.dataset.kid); if (!k) return;
    const v = +t.value; if (v > 0) k[t.dataset.kidProp] = v; else delete k[t.dataset.kidProp];
    saveFamily().then(() => toast('Сохранено')).catch(() => toast('Не получилось сохранить'));
  }
  else if (t.dataset && t.dataset.pid && t.dataset.prizeProp){
    const it = (S.family.prizes || []).find(x => x.id === t.dataset.pid); if (!it) return;
    it[t.dataset.prizeProp] = t.value; render();
    saveFamily().then(() => toast('Сохранено')).catch(() => toast('Не получилось сохранить'));
  }
  else if (t.dataset && t.dataset.book && t.dataset.f){
    const b = bookById(t.dataset.book); if (!b) return;
    b[t.dataset.f] = +t.value;
    if (b.ageMin > b.ageMax){ if (t.dataset.f === 'ageMin') b.ageMax = b.ageMin; else b.ageMin = b.ageMax; }
    Store.set('book_' + b.id, b).then(() => { S.parentMsg = 'Возраст для «' + b.title + '» сохранён'; render(); }).catch(() => toast('Не получилось сохранить'));
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.dataset && e.target.dataset.form;
  if (!f) return;
  e.preventDefault();
  const L = S.login;
  if (!L || L.busy) return;
  if (f === 'loginSend') return loginSend(($('#loginEmail') || {}).value || '');
  if (f === 'loginVerify'){
    const code = (($('#loginCode') || {}).value || '').trim();
    L.err = ''; L.busy = true; render();
    try {
      const d = await authCall('/api/auth/verify', {email:L.email, code});
      Store.remember(d.token, d.email);
      location.reload();
    } catch (err) { L.busy = false; L.err = err.message; render(); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheetEl.hidden) closeSheet();
});

/* ---------- boot ---------- */
async function boot(){
  render();
  Store.init();
  if (!Store.token){ S.login = {step:'email', email:'', err:''}; go('login'); return; }
  try { S.family = await Store.get('family'); } catch (e) { S.family = null; }
  // Migrate per-kid prizes to family.prizes
  if (S.family && !S.family.prizes){
    S.family.prizes = [];
    (S.family.kids || []).forEach(k => { const items = (k.rewards && k.rewards.items) || []; items.forEach(it => { if (it && it.text) S.family.prizes.push({id:newId(), text:it.text, type:'daily', kids:[k.id]}); }); });
    saveFamily().catch(() => {});
  }
  if (S.family && (S.family.prizes || []).some(p => !p.type)){
    S.family.prizes.forEach(p => { if (!p.type) p.type = 'daily'; delete p.tier; });
    saveFamily().catch(() => {});
  }
  await loadBooks();
  if (S.family && S.family.pinHash){ go('profiles'); }
  else { S.setup = {step:'pin1', kids:[], err:''}; S.pinMode = 'setup1'; go('setup'); }
}
boot();
})();
</script>
